# Codemagic 클라우드 빌드 — 모아학원 (Android TWA / iOS App Store)
workflows:
  android-twa-api36:
    name: 모아학원 Android TWA (API 36)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - moa_keystore
      node: 20
      java: 17
    scripts:
      - name: Bubblewrap 설치
        script: npm install -g @bubblewrap/cli
      - name: Bubblewrap을 Codemagic JDK/SDK에 연결
        script: |
          mkdir -p $HOME/.bubblewrap
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > $HOME/.bubblewrap/config.json
          cat $HOME/.bubblewrap/config.json
      - name: 안드로이드 프로젝트 생성 (twa-manifest.json 기반)
        script: |
          bubblewrap update --skipVersionUpgrade
      - name: compileSdk / targetSdk 36 강제
        script: |
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' app/build.gradle || true
          sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/' app/build.gradle || true
          echo "----- SDK 설정 확인 -----"
          grep -E 'compileSdk|targetSdk|minSdk' app/build.gradle || true
      - name: AAB 빌드 (서명 없이)
        script: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
      - name: AAB 서명 (Codemagic 업로드 키)
        script: |
          AAB=$(find . -path '*/bundle/release/*.aab' | head -1)
          echo "unsigned aab: $AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" "$AAB" "$CM_KEY_ALIAS"
          cp "$AAB" "$CM_BUILD_DIR/모아학원-v3-api36.aab"
    artifacts:
      - $CM_BUILD_DIR/*.aab
      - app/build/outputs/**/*.aab

  ios-appstore:
    name: 모아학원 iOS App Store 빌드·TestFlight 업로드
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor
    integrations:
      # Codemagic 웹 UI → Teams > Integrations > App Store Connect 에 등록한 키 이름과 일치해야 함
      app_store_connect: moahagwon_asc_key
    environment:
      vars:
        BUNDLE_ID: "kr.moahagwon.app"
        XCODE_SCHEME: "App"
      # Capacitor 8 CLI는 NodeJS >=22 를 요구한다 (node:20 이면 cap add ios 가 [fatal] 로 죽음)
      node: 22
      xcode: latest
      cocoapods: default
      # ios_signing(distribution_type + bundle_identifier)은 Codemagic UI에 "이미 업로드된" 서명 파일을 가져오는 방식이라
      # 인증서·프로파일이 없으면 "No matching profiles found"로 빌드 전에 실패한다.
      # 대신 아래 스크립트에서 app-store-connect --create 로 인증서와 프로파일을 자동 생성한다.
    scripts:
      # 저장소 루트의 배포본을 그대로 www로 복사 — 웹과 앱의 내용 불일치를 원천 차단
      - name: 웹 자산을 저장소 루트에서 가져오기
        script: |
          rm -rf www && mkdir -p www
          cp ../index.html ../manifest.json ../sw.js ../privacy.html ../terms.html www/
          cp ../icon-192.png ../icon-512.png ../icon-maskable-512.png www/
          ls -la www
      - name: 의존성 설치
        script: npm install
      # 네이티브 플러그인은 npm 패키지라 번들이 필요하다. 앱용 www에만 넣고 웹(moahagwon.com)은 건드리지 않는다.
      - name: 네이티브 기능 번들 생성 + index.html에 주입
        script: |
          npm run build:native
          test -s www/capacitor-native.js || { echo "번들 생성 실패"; exit 1; }
          node -e '
            const fs=require("fs");
            const p="www/index.html";
            let s=fs.readFileSync(p,"utf8");
            const tag="<script src=\"capacitor-native.js\"></script>\n";
            if(!s.includes("capacitor-native.js")){
              if(!s.includes("</head>")) { console.error("</head> 없음"); process.exit(1); }
              s=s.replace("</head>", tag+"</head>");
              fs.writeFileSync(p,s);
            }
            console.log("주입 확인:", s.split("capacitor-native.js").length-1);
          '
      # Capacitor 8은 SPM이 기본이지만 두 가지 이유로 CocoaPods를 쓴다.
      #  1) SPM 템플릿에는 App.xcworkspace 가 없어 build-ipa --workspace 가 실패한다
      #  2) apple-sign-in 7.1.0 의 Package.swift 는 capacitor-swift-pm "from 7.0.0"(=<8.0.0) 이라
      #     CLI가 고정하는 exact 8.4.1 과 교집합이 없어 SPM 해석이 실패한다
      - name: iOS 네이티브 프로젝트 생성 + 자산 동기화
        script: |
          npx cap add ios --packagemanager CocoaPods
          test -d ios/App/App.xcworkspace || { echo "App.xcworkspace 없음 — CocoaPods 템플릿 실패"; exit 1; }
          npx @capacitor/assets generate --ios --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#ffffff' || true
          npx cap sync ios
      - name: Info.plist 권한 문구 추가 (위치·카메라)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '내 주변 학원 검색과 안심 위치 공유, QR 출석 위치 확인에 사용됩니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '출석 QR 코드를 스캔할 때 카메라를 사용합니다.'" "$PLIST" || true
          echo "----- Info.plist 확인 -----"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
      # 푸시(APNs)와 Sign in with Apple 은 entitlements 가 있어야 동작한다. cap add ios 가 만들어주지 않으므로 직접 넣는다.
      - name: entitlements 추가 (푸시 · Apple 로그인)
        script: |
          ENT=ios/App/App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"
          echo "----- entitlements 확인 -----"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          # Xcode 프로젝트가 entitlements 파일을 참조하도록 연결
          python3 - <<'PY'
          import re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          if "CODE_SIGN_ENTITLEMENTS" not in s:
              s = s.replace("PRODUCT_BUNDLE_IDENTIFIER =",
                            "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER =")
              open(p, "w").write(s)
              print("CODE_SIGN_ENTITLEMENTS 추가함")
          else:
              print("CODE_SIGN_ENTITLEMENTS 이미 있음")
          PY
      # 서명 파일이 Apple 계정에 없으면 --create 가 인증서와 프로파일을 새로 만든다.
      # integrations.app_store_connect 가 APP_STORE_CONNECT_* 환경변수를 자동으로 넣어준다.
      # 인증서 생성에는 개인키가 필요하다. CERTIFICATE_PRIVATE_KEY 환경변수(Codemagic UI에 저장)를 쓰고,
      # 없으면 이 빌드에서 새로 만든다. Apple은 Distribution 인증서를 3개까지만 허용하므로
      # 매 빌드마다 새 키를 만들면 곧 한도에 걸린다 → 처음 생성된 키를 로그에 남겨 UI에 등록할 수 있게 한다.
      - name: 서명 인증서·프로파일 확보 (없으면 생성)
        script: |
          set -e
          keychain initialize
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY 없음 — 이번 빌드에서 새 개인키를 생성합니다."
            openssl genrsa -out /tmp/cert_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
            echo "===== 아래 PEM 전체를 Codemagic 환경변수 CERTIFICATE_PRIVATE_KEY 로 저장하세요 (secure 체크) ====="
            cat /tmp/cert_key.pem
            echo "===== 여기까지 ====="
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --strict-match-identifier \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
      - name: 인증서·프로파일 적용
        script: xcode-project use-profiles
      - name: 빌드 번호 자동 증가
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: 아카이브(IPA) 빌드
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - capacitor/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 첫 심사 제출은 App Store Connect 웹에서 수동으로 진행
        submit_to_app_store: false
