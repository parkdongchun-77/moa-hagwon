# Codemagic 클라우드 빌드 — 모아학원 (Android TWA / iOS App Store)
workflows:
  android-twa-api36:
    name: 모아학원 Android TWA (API 36)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - moa_keystore
      node: 20
      java: 17
    scripts:
      - name: Bubblewrap 설치
        script: npm install -g @bubblewrap/cli
      - name: Bubblewrap을 Codemagic JDK/SDK에 연결
        script: |
          mkdir -p $HOME/.bubblewrap
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > $HOME/.bubblewrap/config.json
          cat $HOME/.bubblewrap/config.json
      - name: 안드로이드 프로젝트 생성 (twa-manifest.json 기반)
        script: |
          bubblewrap update --skipVersionUpgrade
      - name: compileSdk / targetSdk 36 강제
        script: |
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' app/build.gradle || true
          sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/' app/build.gradle || true
          echo "----- SDK 설정 확인 -----"
          grep -E 'compileSdk|targetSdk|minSdk' app/build.gradle || true
      - name: AAB 빌드 (서명 없이)
        script: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
      - name: AAB 서명 (Codemagic 업로드 키)
        script: |
          AAB=$(find . -path '*/bundle/release/*.aab' | head -1)
          echo "unsigned aab: $AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" "$AAB" "$CM_KEY_ALIAS"
          cp "$AAB" "$CM_BUILD_DIR/모아학원-v3-api36.aab"
    artifacts:
      - $CM_BUILD_DIR/*.aab
      - app/build/outputs/**/*.aab

  # 2026-10-27 TWA → 네이티브 전환. 앱 알림(FCM)을 받으려면 네이티브여야 한다. 패키지 이름·업로드 키는 TWA 와 같아 플레이 업데이트로 나간다.
  android-capacitor:
    name: 모아학원 Android 네이티브(Capacitor) AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor
    environment:
      android_signing:
        - moa_keystore
      # firebase_moa 그룹: GOOGLE_SERVICES_JSON = google-services.json 을 base64 로 인코딩한 값
      groups:
        - firebase_moa
      vars:
        PACKAGE_NAME: "com.moahagwon.myapp"
        # 플레이에 올라간 마지막 versionCode 보다 커야 한다. 출시할 때마다 올린다.
        VERSION_CODE: "12"
        VERSION_NAME: "1.1.2"
      node: 22
      java: 21
    scripts:
      - name: 웹 자산을 저장소 루트에서 가져오기
        script: |
          rm -rf www && mkdir -p www
          cp ../index.html ../manifest.json ../sw.js ../privacy.html ../terms.html www/
          cp ../icon-192.png ../icon-512.png ../icon-maskable-512.png www/
          ls -la www
      - name: 의존성 설치
        script: npm install
      - name: 네이티브 기능 번들 생성 + index.html에 주입
        script: |
          npm run build:native
          test -s www/capacitor-native.js || { echo "번들 생성 실패"; exit 1; }
          node -e '
            const fs=require("fs");
            const p="www/index.html";
            let s=fs.readFileSync(p,"utf8");
            const tag="<script src=\"capacitor-native.js\"></script>\n";
            if(!s.includes(tag.trim())){
              if(!s.includes("</head>")) { console.error("</head> 없음"); process.exit(1); }
              s=s.replace("</head>", tag+"</head>");
              fs.writeFileSync(p,s);
            }
            if(!fs.readFileSync(p,"utf8").includes(tag.trim())) { console.error("주입 실패: script 태그 없음"); process.exit(1); }
            console.log("주입 확인: script 태그 있음");
          '
      # iOS 번들 ID(kr.moahagwon.app)와 플레이 패키지 이름이 달라 안드로이드 빌드에서만 바꾼다.
      - name: 패키지 이름을 플레이 앱과 맞춤
        script: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.appId=process.env.PACKAGE_NAME;
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
            console.log("appId =",c.appId);
          '
      - name: 안드로이드 네이티브 프로젝트 생성
        script: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#ffffff' || true
      - name: google-services.json (FCM)
        script: |
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "GOOGLE_SERVICES_JSON 없음"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          grep -q "\"package_name\": \"$PACKAGE_NAME\"" android/app/google-services.json || { echo "google-services.json 패키지 이름 불일치"; exit 1; }
      # 위치 권한은 앱이 직접 적어야 한다(Geolocation 플러그인 안내). moahagwon://auth 는 카카오·구글 로그인 뒤 앱으로 돌아오는 주소.
      - name: 권한·로그인 복귀 주소 추가
        script: |
          python3 - <<'PY'
          import sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = ["android.permission.ACCESS_COARSE_LOCATION", "android.permission.ACCESS_FINE_LOCATION"]
          for perm in perms:
              if perm not in s:
                  s = s.replace("</manifest>", f'    <uses-permission android:name="{perm}" />\n</manifest>')
          if 'android:scheme="moahagwon"' not in s:
              filt = """            <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="moahagwon" android:host="auth" />
              </intent-filter>
          """
              if s.count("</activity>") < 1:
                  sys.exit("activity 없음")
              s = s.replace("</activity>", filt + "        </activity>", 1)
          # 카메라·위치는 있으면 쓰는 기능이다. 플러그인이 필수(required=true)로 넣으면 카메라·GPS 없는 태블릿·크롬북이 설치 대상에서 빠진다
          if 'xmlns:tools=' not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          feats = ["android.hardware.camera", "android.hardware.camera.any", "android.hardware.camera.autofocus",
                   "android.hardware.location", "android.hardware.location.gps", "android.hardware.location.network"]
          for f in feats:
              if f'"{f}"' not in s:
                  s = s.replace("</manifest>", f'    <uses-feature android:name="{f}" android:required="false" tools:replace="android:required" />\n</manifest>')
          open(p, "w").write(s)
          for k in perms + ['android:scheme="moahagwon"'] + feats:
              if k not in s: sys.exit("누락: " + k)
          print(s)
          PY
      # 앱 링크 (2026-10-29). 학원 링크(?aca=)·원장 안내(?go=owner)를 설치된 앱이 바로 연다.
      # 경로는 "/" 하나만 받는다 — app-auth.html·pay.html 같은 다른 페이지는 브라우저에 남아야 한다.
      # 확인 파일은 https://moahagwon.com/.well-known/assetlinks.json (Play 서명키·업로드키 지문 2개).
      - name: 앱 링크 등록 (https://moahagwon.com/)
        script: |
          python3 - <<'PY'
          import sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if 'android:host="moahagwon.com"' not in s:
              filt = """            <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="moahagwon.com" android:path="/" />
              </intent-filter>
          """
              if s.count("</activity>") < 1:
                  sys.exit("activity 없음")
              s = s.replace("</activity>", filt + "        </activity>", 1)
              open(p, "w").write(s)
          if 'android:host="moahagwon.com"' not in s:
              sys.exit("앱 링크 등록 실패")
          print("앱 링크 인텐트 필터 있음")
          PY
      - name: 자산 동기화
        script: npx cap sync android
      - name: 버전 설정
        script: |
          G=android/app/build.gradle
          perl -pi -e "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" $G
          grep -E 'applicationId|versionCode|versionName|compileSdk|targetSdk' $G android/variables.gradle || true
          grep -q "versionCode $VERSION_CODE" $G || { echo "versionCode 설정 실패"; exit 1; }
          # 바코드 스캐너 플러그인(ionbarcode)이 minSdk 26 을 요구한다. Capacitor 기본값 24 로는 매니페스트 병합이 실패한다
          perl -pi -e 's/minSdkVersion = \d+/minSdkVersion = 26/' android/variables.gradle
          grep -q 'minSdkVersion = 26' android/variables.gradle || { echo "minSdk 설정 실패"; exit 1; }
      - name: AAB 빌드 (서명 없이)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
      - name: AAB 서명 (Codemagic 업로드 키)
        script: |
          AAB=$(find android -path '*/bundle/release/*.aab' | head -1)
          echo "unsigned aab: $AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" "$AAB" "$CM_KEY_ALIAS"
          cp "$AAB" "$CM_BUILD_DIR/moahagwon-$VERSION_NAME-$VERSION_CODE.aab"
    artifacts:
      - $CM_BUILD_DIR/*.aab
  ios-appstore:
    name: 모아학원 iOS App Store 빌드·TestFlight 업로드
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor
    integrations:
      # Codemagic 웹 UI → Teams > Integrations > App Store Connect 에 등록한 키 이름과 일치해야 함
      app_store_connect: moahagwon_asc_key
    environment:
      # Codemagic UI에 등록한 변수 그룹. 그룹에 속한 변수는 여기에 적어야 빌드에 주입된다.
      # ios_signing 그룹에는 CERTIFICATE_PRIVATE_KEY(secure) 가 들어 있다.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "kr.moahagwon.app"
        XCODE_SCHEME: "App"
        # App Store Connect 의 버전 번호와 반드시 같아야 한다. 다르면 그 버전에 빌드를 붙일 수 없다.
        # 1.0.1 은 이미 출시돼 트레인이 닫혔다 (업로드 시 code 90186 Invalid Pre-Release Train).
        # 출시된 버전으로는 새 빌드를 올릴 수 없으므로 출시할 때마다 여기를 올린다.
        MARKETING_VERSION: "1.0.5"
      # Capacitor 8 CLI는 NodeJS >=22 를 요구한다 (node:20 이면 cap add ios 가 [fatal] 로 죽음)
      node: 22
      xcode: latest
      cocoapods: default
      # ios_signing(distribution_type + bundle_identifier)은 Codemagic UI에 "이미 업로드된" 서명 파일을 가져오는 방식이라
      # 인증서·프로파일이 없으면 "No matching profiles found"로 빌드 전에 실패한다.
      # 대신 아래 스크립트에서 app-store-connect --create 로 인증서와 프로파일을 자동 생성한다.
    scripts:
      # 저장소 루트의 배포본을 그대로 www로 복사 — 웹과 앱의 내용 불일치를 원천 차단
      - name: 웹 자산을 저장소 루트에서 가져오기
        script: |
          rm -rf www && mkdir -p www
          cp ../index.html ../manifest.json ../sw.js ../privacy.html ../terms.html www/
          cp ../icon-192.png ../icon-512.png ../icon-maskable-512.png www/
          ls -la www
      - name: 의존성 설치
        script: npm install
      # 네이티브 플러그인은 npm 패키지라 번들이 필요하다. 앱용 www에만 넣고 웹(moahagwon.com)은 건드리지 않는다.
      - name: 네이티브 기능 번들 생성 + index.html에 주입
        script: |
          npm run build:native
          test -s www/capacitor-native.js || { echo "번들 생성 실패"; exit 1; }
          node -e '
            const fs=require("fs");
            const p="www/index.html";
            let s=fs.readFileSync(p,"utf8");
            const tag="<script src=\"capacitor-native.js\"></script>\n";
            // index.html 주석에도 파일명이 들어 있어 파일명만 검사하면 이미 주입된 것으로 오판한다. 태그 자체로 검사한다.
            if(!s.includes(tag.trim())){
              if(!s.includes("</head>")) { console.error("</head> 없음"); process.exit(1); }
              s=s.replace("</head>", tag+"</head>");
              fs.writeFileSync(p,s);
            }
            if(!fs.readFileSync(p,"utf8").includes(tag.trim())) { console.error("주입 실패: script 태그 없음"); process.exit(1); }
            console.log("주입 확인: script 태그 있음");
          '
      # Capacitor 8은 SPM이 기본이지만 두 가지 이유로 CocoaPods를 쓴다.
      #  1) SPM 템플릿에는 App.xcworkspace 가 없어 build-ipa --workspace 가 실패한다
      #  2) apple-sign-in 7.1.0 의 Package.swift 는 capacitor-swift-pm "from 7.0.0"(=<8.0.0) 이라
      #     CLI가 고정하는 exact 8.4.1 과 교집합이 없어 SPM 해석이 실패한다
      - name: iOS 네이티브 프로젝트 생성 + 자산 동기화
        script: |
          npx cap add ios --packagemanager CocoaPods
          test -d ios/App/App.xcworkspace || { echo "App.xcworkspace 없음 — CocoaPods 템플릿 실패"; exit 1; }
          npx @capacitor/assets generate --ios --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#ffffff' || true
          npx cap sync ios
      # cap add ios 템플릿의 AppDelegate 에는 APNs 토큰을 Capacitor 로 넘기는 코드가 없다.
      # 이게 없으면 PushNotifications 의 registration 이벤트가 오지 않아 토큰이 저장되지 않는다(2026-10-27 iOS 토큰 0건 원인).
      - name: AppDelegate 에 푸시 토큰 전달 추가
        script: |
          python3 - <<'PY'
          import sys
          p = "ios/App/App/AppDelegate.swift"
          s = open(p).read()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
              i = s.rstrip().rfind("}")
              s = s[:i] + add + s[i:]
              open(p, "w").write(s)
          n = s.count("capacitorDidRegisterForRemoteNotifications")
          print("AppDelegate 푸시 전달 건수:", n)
          if n != 1:
              sys.exit("AppDelegate 수정 실패")
          PY
      - name: Info.plist 권한 문구 추가 (위치·카메라)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '내 주변 학원 검색과 안심 위치 공유, QR 출석 위치 확인에 사용됩니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '출석 QR 코드를 스캔할 때 카메라를 사용합니다.'" "$PLIST" || true
          # 앱이 자체 암호화를 구현하지 않고 OS의 HTTPS만 쓰므로 수출 규정 면제 대상이다.
          # 이 키가 없으면 업로드할 때마다 App Store Connect에서 수출 규정 문서를 요구한다.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          # 이 키가 없으면 App Store 제품 페이지 정보란에 지원 언어가 "영어"로만 표시된다.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ko" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ko" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ko" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$PLIST"
          echo "----- Info.plist 확인 -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          # 카카오·구글 로그인 뒤 app-auth.html 이 moahagwon://auth 로 앱을 다시 연다.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string kr.moahagwon.app.auth" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string moahagwon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      # 푸시(APNs)와 Sign in with Apple 은 entitlements 가 있어야 동작한다. cap add ios 가 만들어주지 않으므로 직접 넣는다.
      - name: entitlements 추가 (푸시 · Apple 로그인)
        script: |
          ENT=ios/App/App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"
          # 유니버설 링크 (2026-10-29) — 학원 링크 https://moahagwon.com/?aca=… 를 앱이 연다
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:0 string applinks:moahagwon.com" "$ENT"
          echo "----- entitlements 확인 -----"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          # Xcode 프로젝트가 entitlements 파일을 참조하도록 연결
          python3 - <<'PY'
          import re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          if "CODE_SIGN_ENTITLEMENTS" not in s:
              s = s.replace("PRODUCT_BUNDLE_IDENTIFIER =",
                            "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER =")
              open(p, "w").write(s)
              print("CODE_SIGN_ENTITLEMENTS 추가함")
          else:
              print("CODE_SIGN_ENTITLEMENTS 이미 있음")
          PY
      # iPad 레이아웃을 검증한 적이 없어 1.0은 iPhone 전용으로 출시한다.
      # 이 설정이 없으면 App Store가 13" iPad 스크린샷을 필수로 요구한다.
      - name: iPhone 전용으로 설정 (iPad 미지원)
        script: |
          python3 - <<'PY'
          import re, sys
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          before = s
          s = re.sub(r'TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;', 'TARGETED_DEVICE_FAMILY = "1";', s)
          if s == before:
              # 키가 아예 없으면 PRODUCT_BUNDLE_IDENTIFIER 앞에 넣는다
              s = s.replace("PRODUCT_BUNDLE_IDENTIFIER =",
                            'TARGETED_DEVICE_FAMILY = "1";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER =')
          open(p, "w").write(s)
          n = s.count('TARGETED_DEVICE_FAMILY = "1";')
          print("TARGETED_DEVICE_FAMILY=1 설정 건수:", n)
          if n == 0 or 'TARGETED_DEVICE_FAMILY = "1,2"' in s:
              sys.exit("iPhone 전용 설정 실패")
          PY
      # 서명 파일이 Apple 계정에 없으면 --create 가 인증서와 프로파일을 새로 만든다.
      # integrations.app_store_connect 가 APP_STORE_CONNECT_* 환경변수를 자동으로 넣어준다.
      # 인증서 생성에는 개인키가 필요하다. Codemagic 환경변수 CERTIFICATE_PRIVATE_KEY(secure)에 저장해 두고 재사용한다.
      # Apple은 Distribution 인증서를 3개까지만 허용하므로 빌드마다 새 키를 만들면 곧 한도에 걸린다.
      # 키는 로컬에서 openssl genrsa 로 만들어 환경변수에 넣는다. 로그로는 절대 출력하지 않는다.
      - name: 서명 인증서·프로파일 확보
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "환경변수 CERTIFICATE_PRIVATE_KEY 가 없습니다."
            echo "Codemagic > App settings > Environment variables 에 secure 로 등록하세요."
            exit 1
          fi
          keychain initialize
          # 유니버설 링크는 App ID 에 Associated Domains 기능이 켜져 있어야 프로파일에 들어간다.
          # 켜면 예전 프로파일은 무효가 되고 아래 --create 가 기능이 들어간 새 프로파일을 만든다. 이미 켜져 있으면 그대로 지나간다.
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          app-store-connect bundle-ids enable-capabilities "$BID" --capability "Associated Domains" \
            || echo "  Associated Domains 켜기 실패(이미 켜져 있으면 정상) — 아래 프로파일 확인에서 다시 본다"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --strict-match-identifier \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          grep -rlaq 'com.apple.developer.associated-domains' "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null \
            || { echo "★ 받은 프로파일에 Associated Domains 가 없다 — Apple Developer > Identifiers > $BUNDLE_ID 에서 기능을 켜고 다시 빌드"; exit 1; }
          keychain add-certificates
      - name: 인증서·프로파일 적용
        script: xcode-project use-profiles
      # get-latest-app-store-build-number 가 빈 값을 반환하면 $((LATEST+1)) 이 1이 되어
      # "bundle version must be higher than the previously uploaded version" 로 업로드가 거부된다(빌드 9).
      # Codemagic 의 $BUILD_NUMBER 는 앱마다 단조 증가하므로 둘 중 큰 값을 쓴다.
      - name: 빌드 번호 자동 증가
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null | tail -1 | tr -cd '0-9')
          [ -z "$LATEST" ] && LATEST=0
          NEXT=$((LATEST + 1))
          [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ] && NEXT="$BUILD_NUMBER"
          echo "App Store 최신 빌드번호: $LATEST / Codemagic BUILD_NUMBER: ${BUILD_NUMBER:-없음} → 사용: $NEXT"
          [ "$NEXT" -gt 0 ] || { echo "빌드번호 계산 실패"; exit 1; }
          agvtool new-version -all "$NEXT"
          # 마케팅 버전(1.0.1 같은 사용자에게 보이는 번호)은 빌드번호와 별개다.
          # cap add ios 가 매번 1.0 으로 만들기 때문에 여기서 덮어써야 App Store 버전과 맞는다.
          agvtool new-marketing-version "$MARKETING_VERSION"
          echo "----- 버전 확인 -----"
          agvtool what-marketing-version -terse1
          agvtool what-version -terse
      - name: 아카이브(IPA) 빌드
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    # 아티팩트 경로는 working_directory(capacitor) 기준이다.
    # 빌드 로그 확인: "Successfully exported ipa to build/ios/ipa/App.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 첫 심사 제출은 App Store Connect 웹에서 수동으로 진행
        submit_to_app_store: false
