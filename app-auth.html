<!-- 네이티브 앱 카카오·구글 로그인 콜백: 시스템 브라우저에서 받은 인가코드를 moahagwon:// 으로 앱에 돌려보낸다 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>모아학원 로그인</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;box-sizing:border-box;background:#fff;color:#1f2937;text-align:center}
a{display:inline-block;margin-top:16px;padding:14px 28px;background:#4f46e5;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div>
  <p id="msg">앱으로 돌아가는 중입니다...</p>
  <a id="back" href="#">모아학원 앱으로 돌아가기</a>
</div>
<script>
// 자동 이동이 막히는 브라우저가 있어 버튼도 같은 주소로 둔다.
const target = "moahagwon://auth" + location.search;
document.getElementById("back").href = target;
if (!new URLSearchParams(location.search).get("code")) {
  document.getElementById("msg").textContent = "로그인이 취소되었거나 실패했습니다. 앱으로 돌아가 다시 시도해 주세요.";
}
location.replace(target);
</script>
</body>
</html>
